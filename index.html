<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohel AI Worlds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Main App Container -->
    <div class="app-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>
            <div class="chat-history-container">
                <div class="history-title">Chat Library</div>
                <div class="history-list" id="historyList">
                    <!-- Dynamic chat history items will appear here -->
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileSection">
                    <span id="userEmailDisplay">Guest User</span>
                    <button id="authTriggerBtn" class="auth-btn">Sign In</button>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-main">
            <header class="chat-header">
                <button id="sidebarToggle" class="icon-btn"><i class="fa-solid fa-bars"></i></button>
                <h2>Sohel AI Worlds</h2>
                <div class="header-right"></div>
            </header>

            <div class="chat-box" id="chatBox">
                <div class="welcome-screen">
                    <h1>What can I help with today?</h1>
                </div>
            </div>

            <!-- Input Form Area -->
            <div class="chat-input-wrapper">
                <div class="input-container">
                    <div class="attachment-preview" id="attachmentPreview"></div>
                    <textarea id="userInput" placeholder="Ask Sohel AI Worlds..." rows="1"></textarea>
                    
                    <div class="input-actions">
                        <label for="fileUpload" class="icon-btn file-label" title="Attach Image/Video">
                            <i class="fa-solid fa-paperclip"></i>
                        </label>
                        <input type="file" id="fileUpload" accept="image/*,video/*" multiple style="display: none;">
                        
                        <button id="voiceBtn" class="icon-btn" title="Voice Input"><i class="fa-solid fa-microphone"></i></button>
                        <button id="sendBtn" class="send-btn" disabled><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>
                <div class="disclaimer">Sohel AI Worlds can make mistakes. Verify important info.</div>
            </div>
        </main>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal" style="display: none;">
        <div class="modal-box">
            <h2 id="modalTitle">Sign In / Sign Up</h2>
            <p id="modalSub">Enter a valid email address to continue (Temp mail & numbers not allowed)</p>
            <input type="email" id="emailInputField" placeholder="name@example.com">
            <div id="emailErrorMsg" class="error-text"></div>
            <div class="modal-actions">
                <button id="submitAuthBtn" class="primary-btn">Continue</button>
                <button id="closeModalBtn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
